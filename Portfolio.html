    <title>Portfolio</title>

<body>

<div class="page-wrapper">

    <!-- 1. NAVIGATION MENU -->
    <nav id="topmenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="About.html">About me</a></li>
            <li><a href="Portfolio.html">Portfolio</a></li>
            <li><a href="Contact.html">Contact information</a></li>
        </ul>
    </nav>
    
    <!-- 2. MAIN CONTENT WINDOW -->
    <div class="main-content">
        
        <header class="title-card">
            <h1>CLUBS THAT JAYDON IS APART OF</h1>
        </header>

        <!-- Main section containing your different club portfolio blocks -->
        <main class="portfolio-stack">
            
            <!-- Karate Club Section -->
            <section class="card">
                <h2>The Grenada Shotokan Karate Association</h2>
                <div class="image-gallery karate">
                    <img class="six" src="six.jpg" alt="This photo is showing six karate masters">
                    <img class="group" src="group.jpg" alt="This is a group of karate masters">
                    <img class="grading" src="grading.jpeg" alt="This is a photo of a guy who completed a grading for his next color belt">
                </div>
            </section>

            <!-- Hiking Club Section -->
            <section class="card">
                <h2>TAMCC Hiking Club</h2>
                <div class="image-gallery hiking">
                    <img class="stones" src="stones.jpg" alt="These are students stepping over stones"> 
                    <img class="trail" src="Trail.jpg" alt="This is a trail">
                    <img class="people" src="people.jpg" alt="These are students walking through the bushes">
                </div>
            </section>

            <!-- Photography Club Section -->
            <section class="card">
                <h2>TAMCC Photography Club</h2>
                <div class="image-gallery photography">
                    <img class="purp" src="purpflower.jpg" alt="This is a puurple flower">
                    <img class="leaf" src="leaf.jpg" alt="This is a red flower">
                    <img class="sky" src="sky.jpg" alt="This is a beautiful sky">
                </div>
            </section>

        </main>

    </div> <!-- End Main Content -->
